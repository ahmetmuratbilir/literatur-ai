<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140">
  <!-- Yatay logo: işaret + "Literatür AI". Yazı sistem yazı tipiyle çizilir. -->
<defs>
  <linearGradient id="lit-bg" x1="18" y1="6" x2="122" y2="134" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6d5dfc"/><stop offset=".55" stop-color="#5b4cf0"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="lit-shine" x1="70" y1="0" x2="70" y2="80" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="lit-bolt" x1="60" y1="22" x2="80" y2="118" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8e5ff"/></linearGradient>
</defs>
  <g transform="translate(10 10) scale(.857)">
    <rect width="140" height="140" rx="34" fill="url(#lit-bg)"/>
    <rect width="140" height="140" rx="34" fill="url(#lit-shine)"/>
    <path d="M83 20 L41 77 H67 L57 120 L100 61 H74 Z" fill="url(#lit-bolt)" stroke="url(#lit-bolt)" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <text x="152" y="91" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#0c1220" letter-spacing="-1.6">Literatür <tspan fill="#4f46e5">AI</tspan></text>
</svg>
